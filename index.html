<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Quest: Defeat the Procrastinator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1730;--navy2:#13284f;--navy3:#1c3a6c;--line:#2b4a80;
  --teal:#2ec4b6;--teal2:#169e92;--amber:#ffb627;--red:#ff5a5f;--green:#5be37d;
  --text:#eef4ff;--muted:#9fb3d6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--navy);color:var(--text);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 20% 0%,#1a3363 0,transparent 45%),radial-gradient(circle at 100% 100%,#123a4a 0,transparent 40%);min-height:100vh}
.px{font-family:'Press Start 2P',monospace;letter-spacing:.5px;line-height:1.6}
.tiny{font-size:9px;color:var(--muted)}
.small{font-size:11px}
a{color:var(--teal)}
button{font-family:inherit}
input,textarea,select{font:inherit;color:var(--text);background:#0a1530;border:2px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,196,182,.25)}
textarea{resize:vertical}
label{display:block}

/* header */
header{display:flex;align-items:center;gap:18px;padding:14px 20px;background:#081024;border-bottom:3px solid var(--line);position:sticky;top:0;z-index:20}
.bosswrap{position:relative;width:96px;flex:0 0 96px}
.bossimg{width:96px;height:72px;display:block;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite}
.boss.hit .bossimg{animation:shake .45s linear;filter:drop-shadow(0 0 8px var(--red)) brightness(1.5)}
.boss.dead .bossimg{animation:none;opacity:.55;transform:rotate(90deg) translateX(10px)}
.zzz{position:absolute;right:-4px;top:-6px;font-size:10px;color:var(--muted);animation:zz 2.4s infinite}
.boss.dead .zzz{display:none}
@keyframes bob{50%{transform:translateY(3px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes zz{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.hud{flex:1;min-width:0}
.title{font-size:18px;color:var(--amber);text-shadow:3px 3px 0 #7a4b00}
.sub{font-size:10px;color:var(--teal);margin-top:4px}
.hpwrap{display:flex;align-items:center;gap:10px;margin-top:10px}
.hp{flex:1;max-width:420px;height:16px;background:#2a0d14;border:2px solid #000;box-shadow:0 0 0 2px var(--line);position:relative}
#hpbar{height:100%;background:linear-gradient(#ff7a7e,#d93a40);transition:width .8s steps(12)}
.speech{position:absolute;left:0;top:calc(100% + 14px);width:max-content;background:#fff;color:#111;font-size:12px;padding:8px 10px;border-radius:8px;max-width:260px;box-shadow:3px 3px 0 #000;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;font-weight:700}
.speech.show{opacity:1}
.speech:before{content:"";position:absolute;left:36px;top:-10px;border:5px solid transparent;border-bottom-color:#fff}
.stats{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#pname{font-weight:700}
#xp{color:var(--amber);font-size:14px}
.iconbtn{background:transparent;border:2px solid var(--line);color:var(--text);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px}

/* nav */
nav{display:flex;gap:8px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:rgba(10,20,44,.6)}
.step{font-family:'Press Start 2P',monospace;font-size:9px;padding:9px 11px;border-radius:6px;border:2px solid var(--line);background:var(--navy2);color:var(--muted);cursor:pointer}
.step.on{border-color:var(--amber);color:var(--amber)}
.step.done{color:var(--green);border-color:#2f7a48}
.step:disabled{opacity:.4;cursor:not-allowed}

main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
.panel{background:rgba(19,40,79,.85);border:3px solid var(--line);border-radius:12px;padding:22px;box-shadow:6px 6px 0 rgba(0,0,0,.35);margin-bottom:20px}
.panel h2{font-size:15px;color:var(--amber);margin:0 0 6px}
.panel h3{font-size:11px;color:var(--teal);margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:rgba(10,21,48,.75);border:2px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 8px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:220px}
.btn{font-family:'Press Start 2P',monospace;font-size:10px;padding:12px 16px;border-radius:8px;border:none;cursor:pointer;color:#06121f;background:var(--teal);box-shadow:0 4px 0 var(--teal2);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal2)}
.btn.amber{background:var(--amber);box-shadow:0 4px 0 #b47a00}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none}
.btn.red{background:var(--red);box-shadow:0 4px 0 #a5262b;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.center{text-align:center}
.mt{margin-top:14px}

/* level 1 */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:12px;border-radius:8px;border:2px solid var(--line);background:var(--navy2);color:var(--muted);cursor:pointer;font-family:'Press Start 2P',monospace;font-size:10px}
.tab.on{border-color:var(--amber);color:var(--amber)}
.tab.forged{color:var(--green)}
.smartrow{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.smartrow:last-child{border-bottom:none}
.letter{width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:22px;background:#0a1530;border:3px solid var(--line);color:#3c5486;transition:all .2s}
.letter.warn{border-color:var(--amber);color:var(--amber)}
.letter.ok{border-color:var(--green);color:#06121f;background:var(--green);box-shadow:0 0 14px rgba(91,227,125,.6)}
.q{font-weight:700;margin-bottom:4px}
.msg{font-size:13px;margin-top:5px;min-height:18px;color:var(--muted)}
.msg.warn{color:var(--amber)}
.msg.ok{color:var(--green)}
.preview{border-left:4px solid var(--amber);background:rgba(255,182,39,.08);padding:12px 14px;border-radius:6px;font-size:15px}
.preview .blank{color:#5d76a6;font-style:italic}
.forgeflash{animation:flash .8s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--amber)}50%{box-shadow:0 0 0 14px rgba(255,182,39,.0),0 0 40px var(--amber)}100%{box-shadow:none}}

/* level 2 */
.dumprow{display:grid;grid-template-columns:1fr 190px auto;gap:10px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin:10px 0}
.catgrid div{font-size:13px;color:var(--muted);background:rgba(10,21,48,.6);border-radius:6px;padding:7px 9px;border:1px solid var(--line)}
.catgrid b{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#203f73;border:2px solid #3a5f9e;border-radius:6px;padding:6px 9px;margin:4px;cursor:grab;font-size:14px;user-select:none;max-width:100%}
.chip .cat{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--muted);background:#0a1530;padding:3px 5px;border-radius:3px;white-space:nowrap}
.chip.smart{border-color:var(--amber);background:#4a3a12}
.chip.sel{outline:3px solid var(--teal);outline-offset:2px}
.chip .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px}
.tray{min-height:60px;border:2px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:12px}
.tray.drop,.quad.drop{background:rgba(46,196,182,.12)}
.matrixwrap{display:grid;grid-template-columns:34px 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:8px}
.axis{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.axis.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad{border:3px solid var(--line);border-radius:10px;padding:10px;min-height:170px;cursor:pointer;position:relative}
.quad h4{margin:0 0 2px;font-family:'Press Start 2P',monospace;font-size:10px}
.quad .qs{font-size:12px;color:var(--muted);margin-bottom:6px}
.q1{border-color:#ff5a5f;background:rgba(255,90,95,.07)} .q1 h4{color:#ff8a8e}
.q2{border-color:#2ec4b6;background:rgba(46,196,182,.07)} .q2 h4{color:var(--teal)}
.q3{border-color:#ffb627;background:rgba(255,182,39,.06)} .q3 h4{color:var(--amber)}
.q4{border-color:#6b7da3;background:rgba(107,125,163,.07)} .q4 h4{color:#a9b8d8}
.fb{list-style:none;padding:0;margin:0}
.fb li{padding:9px 12px;border-radius:6px;margin-bottom:6px;font-size:15px}
.fb li.good{background:rgba(91,227,125,.12);border-left:4px solid var(--green)}
.fb li.warn{background:rgba(255,182,39,.12);border-left:4px solid var(--amber)}

/* level 3 */
.l3{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pal{border:2px solid transparent;border-radius:6px;padding:6px 9px;font-size:13px;font-weight:700;cursor:pointer;color:#06121f}
.pal.on{border-color:#fff;box-shadow:0 0 0 2px #000,0 0 12px rgba(255,255,255,.5);transform:translateY(-2px)}
.pal.erase{background:#0a1530;color:var(--text);border-color:var(--line)}
.gridscroll{overflow:auto;max-height:640px;border:2px solid var(--line);border-radius:8px;touch-action:none}
table.wk{border-collapse:collapse;width:100%;user-select:none;table-layout:fixed}
.wk th{position:sticky;top:0;background:#0a1530;font-family:'Press Start 2P',monospace;font-size:9px;padding:8px 2px;color:var(--muted);z-index:2}
.wk th.hr{position:sticky;left:0;font-size:8px;width:46px;text-align:right;padding-right:6px;z-index:1;top:auto}
.wk td{height:24px;border:1px solid #20365f;cursor:crosshair;background:#0d1d3d}
.wk tr:nth-child(odd) td{background-color:#0f2145}
.wk td[data-c]{border-color:rgba(0,0,0,.25)}
.meter{margin-bottom:12px}
.meter .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:12px;background:#0a1530;border:2px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
.bar>div{height:100%;transition:width .3s}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.7}
.req{list-style:none;padding:0;margin:0;font-size:14px}
.req li{padding:3px 0}
.req li.ok{color:var(--green)}
.req li.no{color:var(--muted)}
.backlist{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.backlist li{background:rgba(10,21,48,.8);border:1px solid var(--line);padding:7px 9px;border-radius:6px;margin-bottom:6px}
.checklist label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:3px 0}
.checklist input{width:auto;margin-top:4px}

/* level 4 */
.strats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.strat{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:rgba(10,21,48,.7);transition:all .15s}
.strat:hover{border-color:var(--teal)}
.strat.on{border-color:var(--amber);background:rgba(255,182,39,.1);box-shadow:0 0 0 2px var(--amber)}
.strat b{display:block;margin-bottom:4px}
.strat span{font-size:13px;color:var(--muted)}
.pomo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pomoclock{font-family:'Press Start 2P',monospace;font-size:30px;color:var(--red);background:#0a1530;padding:14px 18px;border-radius:10px;border:3px solid var(--line);min-width:200px;text-align:center}
.pomoclock.brk{color:var(--teal)}
.count{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.check input{width:22px;height:22px}

/* report */
.slide{background:#f7f9fc;color:#14213d;border-radius:10px;padding:20px 22px;margin-bottom:16px;border-top:10px solid var(--teal);box-shadow:6px 6px 0 rgba(0,0,0,.35)}
.slide h3{font-family:'Press Start 2P',monospace;font-size:11px;color:#0b6f66;margin:0 0 12px}
.slide p,.slide li{font-size:15px}
.slide .lbl{font-weight:700;color:#0b1730}
.slide.amb{border-top-color:var(--amber)}
.slide .cp{float:right}
.victory{text-align:center;padding:30px 20px}
.victory .big{font-size:22px;color:var(--amber);text-shadow:3px 3px 0 #7a4b00;margin-bottom:10px}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.badge{background:#0a1530;border:2px solid var(--amber);border-radius:8px;padding:8px 10px;font-size:13px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:#06121f;border:3px solid var(--amber);color:var(--amber);font-family:'Press Start 2P',monospace;font-size:11px;padding:14px 18px;border-radius:10px;transition:transform .3s;z-index:50;box-shadow:4px 4px 0 #000;text-align:center;max-width:92vw}
#toast.show{transform:translateX(-50%) translateY(0)}
.float{position:fixed;font-family:'Press Start 2P',monospace;color:var(--amber);font-size:14px;pointer-events:none;z-index:60;animation:floatup 1.1s forwards;text-shadow:2px 2px 0 #000}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}

/* week builder labels */
.wk td{font-size:10px;font-weight:700;color:#06121f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;line-height:22px}
/* daily quests */
.prileg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.prileg div{flex:1;min-width:200px;border-radius:8px;padding:10px 12px;background:rgba(10,21,48,.75);border:2px solid var(--pc)}
.prileg b{color:var(--pc);font-family:'Press Start 2P',monospace;font-size:10px;display:block;margin-bottom:5px}
.days3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.daycard{background:rgba(10,21,48,.85);border:3px solid var(--line);border-radius:12px;padding:14px;transition:border-color .2s,box-shadow .2s}
.daycard.active{border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,196,182,.25)}
.daycard.ready{border-color:var(--green)}
.daycard.active.ready{box-shadow:0 0 0 3px rgba(91,227,125,.3)}
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dayhead .px{font-size:11px;color:var(--amber);white-space:nowrap}
.dayhead select{width:auto;flex:1;min-width:0;padding:5px 8px}
.cnt{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--amber)}
.cnt.ok{color:var(--green)}
.gauge{height:10px;background:#0a1530;border:2px solid var(--line);border-radius:4px;position:relative;margin-bottom:10px;overflow:hidden}
.gauge>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .3s}
.gauge .mk{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:71.4%}
.addrow{display:flex;gap:6px;margin:8px 0}
.addrow.wiggle{animation:shake .4s}
.pbtn{flex:1;font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 4px;border-radius:6px;border:2px solid var(--pc);background:transparent;color:var(--pc);cursor:pointer}
.pbtn:hover{background:var(--pc);color:#06121f}
.qlist{list-style:none;padding:0;margin:8px 0}
.qlist li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;background:#132a55;margin-bottom:6px;font-size:14px;animation:pop .3s}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.qlist li span{flex:1;min-width:0;overflow-wrap:anywhere}
.pbadge{font-family:'Press Start 2P',monospace;font-size:7px;padding:6px;border-radius:4px;border:none;cursor:pointer;color:#06121f;white-space:nowrap}
.qlist .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}
.pool .chip{cursor:pointer}
/* mirror */
.mirror .data{background:rgba(127,214,255,.08);border-left:4px solid #7fd6ff;padding:10px 12px;border-radius:6px;font-size:14px;margin:8px 0 12px}
.stratchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.schip{border:2px solid var(--line);background:var(--navy2);color:var(--text);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px}
.schip.on{border-color:var(--amber);background:rgba(255,182,39,.15);color:var(--amber);font-weight:700}
/* template */
.tplscroll{overflow-x:auto}
table.tpl{border-collapse:collapse;width:100%;font-size:12px;min-width:760px}
table.tpl th,table.tpl td{border:1px solid #9aa8c0;padding:4px 6px;text-align:left;vertical-align:top;color:#14213d}
table.tpl th{background:#e6ecf5}
table.tpl td.t{width:56px;font-weight:700;background:#f0f3f8}
.todo3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.todo3 ol{margin:6px 0;padding-left:0;list-style:none}
.dlrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:900px){.days3,.todo3{grid-template-columns:1fr}}

/* party engine */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
#flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:75;opacity:0}
#flash.go{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
body.quake main,body.quake header,body.quake nav{animation:quake .5s linear}
@keyframes quake{0%,100%{transform:none}15%{transform:translate(calc(var(--q)*-1),calc(var(--q)*.6))}30%{transform:translate(var(--q),calc(var(--q)*-.6))}45%{transform:translate(calc(var(--q)*-.7),var(--q))}60%{transform:translate(calc(var(--q)*.7),calc(var(--q)*-.4))}80%{transform:translate(calc(var(--q)*-.3),calc(var(--q)*.3))}}
#banner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:80;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;overflow:hidden}
#banner.show{opacity:1;visibility:visible}
#banner.big{background:radial-gradient(circle,rgba(8,16,36,.7) 0,rgba(8,16,36,0) 65%)}
#banner .bw{font-family:'Press Start 2P',monospace;font-size:clamp(26px,6vw,68px);text-align:center;line-height:1.3;padding:0 24px;position:relative;
  background:linear-gradient(90deg,#ffb627,#ff5a5f,#ff7eb6,#8a6bff,#2ec4b6,#5be37d,#ffb627);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(5px 5px 0 #000) drop-shadow(0 0 22px rgba(255,182,39,.55))}
#banner.show .bw{animation:slam .6s cubic-bezier(.2,1.6,.4,1) both,rainbow 1.1s linear infinite}
#banner .bs{font-family:'Press Start 2P',monospace;font-size:clamp(11px,1.6vw,17px);color:#fff;text-shadow:3px 3px 0 #000;margin-top:18px;text-align:center;padding:0 24px;position:relative}
#banner.show .bs{animation:slam .6s .15s cubic-bezier(.2,1.6,.4,1) both}
#banner .rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(rgba(255,182,39,.2) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%)}
#banner.big .rays{opacity:1;animation:spin 7s linear infinite}
#banner.big .bw{font-size:clamp(30px,7.5vw,84px)}
@keyframes slam{0%{transform:scale(4) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 4px 0 #b47a00,0 0 26px 8px rgba(255,182,39,.75)}}

@media (max-width:900px){
  .l3{grid-template-columns:1fr}
  .dumprow{grid-template-columns:1fr}
  header{flex-wrap:wrap}
  .title{font-size:14px}
}
</style>
</head>
<body>
<header>
  <div class="bosswrap">
    <div class="boss" id="boss"></div>
    <div class="speech" id="speech"></div>
  </div>
  <div class="hud">
    <div class="px title">TIME QUEST</div>

function tone(f,d,type,vol,delay){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime+(delay||0),v=vol||.05;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.08));o.start(t);o.stop(t+(d||.08)+.03);}catch(e){}}

function sweep(f1,f2,d,type,vol,delay){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  const t=AC.currentTime+(delay||0);o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,vol,delay,freq){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const len=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,len,AC.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const src=AC.createBufferSource();src.buffer=buf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1000;
  const g=AC.createGain();g.gain.value=vol||.2;src.connect(f);f.connect(g);g.connect(AC.destination);src.start(AC.currentTime+(delay||0))}catch(e){}}

    [0,.3,.88].forEach(t=>noise(.25,.08,t,4000))},

/* ---------- PARTY ENGINE: confetti, fireworks, banners ---------- */
let partyOn=true;try{partyOn=localStorage.getItem(KEY+'-party')!=='off'}catch(e){}
const REDUCE=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

const cx=cv.getContext('2d');let P=[],R=[],raf=null;
function sizeCv(){const d=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
sizeCv();addEventListener('resize',sizeCv);
const COLORS=['#ffb627','#2ec4b6','#ff5a5f','#5be37d','#8a6bff','#7fd6ff','#ff7eb6','#ffffff','#ffe066'];
const HYPE=['AMAZING!','UNSTOPPABLE!','ON FIRE!','CRUSHED IT!','BIG BRAIN MOVE!','NO DAYS OFF!','MAIN CHARACTER ENERGY!','SHEESH!','ABSOLUTE LEGEND!','TOO EASY!','HUGE W!','GOAT STATUS!'];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const MAXP=REDUCE?250:2400;
function center(el){if(!el)return{x:innerWidth/2,y:innerHeight/2};const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function kick(){if(!raf)raf=requestAnimationFrame(loop)}
function confetti(x,y,n,o){o=o||{};const ang=o.angle==null?-Math.PI/2:o.angle,spr=o.spread==null?1:o.spread,pw=o.power||12;
  for(let i=0;i<n&&P.length<MAXP;i++){const a=ang+rnd(-spr,spr),sp=rnd(pw*.35,pw);
    P.push({k:'c',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:rnd(6,12),h:rnd(4,8),r:rnd(0,6.3),vr:rnd(-.25,.25),c:pick(o.colors||COLORS),life:rnd(150,250),t:0,round:Math.random()<.22,star:Math.random()<.14})}
  kick()}
function sparks(x,y,n,colors,power){for(let i=0;i<n&&P.length<MAXP;i++){const a=rnd(0,6.283),sp=rnd(.5,power||6);
  P.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(40,80),t:0,c:pick(colors||COLORS),sz:rnd(1.5,3.2)})}kick()}
function rocket(){R.push({x:rnd(innerWidth*.12,innerWidth*.88),y:innerHeight+10,vx:rnd(-1.2,1.2),vy:-rnd(11.5,15.5),c:pick(COLORS),c2:pick(COLORS)});sfx.launch();kick()}
function explode(r){const cols=[r.c,r.c,r.c2,'#fff'],n=REDUCE?30:100,ring=rnd(4,7.5);
  for(let i=0;i<n&&P.length<MAXP;i++){const a=i/n*6.283,sp=ring*rnd(.85,1.05);P.push({k:'s',x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(55,95),t:0,c:pick(cols),sz:rnd(1.8,3.4)})}
  sparks(r.x,r.y,REDUCE?10:45,cols,3);sfx.boom()}
function starPath(rad){cx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?rad*.45:rad;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}cx.closePath();cx.fill()}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=R.length-1;i>=0;i--){const r=R[i];r.x+=r.vx;r.y+=r.vy;r.vy+=.18;
    if(P.length<MAXP)P.push({k:'s',x:r.x,y:r.y,vx:rnd(-.5,.5),vy:rnd(.5,1.5),life:22,t:0,c:'#ffe1a0',sz:2});
    if(r.vy>-2){explode(r);R.splice(i,1)}}
  cx.globalCompositeOperation='lighter';
  for(let i=P.length-1;i>=0;i--){const p=P[i];if(p.k!=='s')continue;p.t++;p.vy+=.07;p.vx*=.97;p.vy*=.97;p.x+=p.vx;p.y+=p.vy;
    const a=Math.max(0,1-p.t/p.life);cx.globalAlpha=a;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.sz*(.5+a*.7),0,6.283);cx.fill();
    if(p.t>=p.life)P.splice(i,1)}
  cx.globalCompositeOperation='source-over';
  for(let i=P.length-1;i>=0;i--){const p=P[i];if(p.k!=='c')continue;p.t++;p.vy=Math.min(p.vy+.22,4.6);p.vx*=.982;p.x+=p.vx+Math.sin(p.t/9+p.r)*.8;p.y+=p.vy;p.r+=p.vr;
    cx.globalAlpha=Math.max(0,Math.min(1,(p.life-p.t)/30));cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.cos(p.t/6+p.r));cx.fillStyle=p.c;
    if(p.round){cx.beginPath();cx.arc(0,0,p.w/2.4,0,6.283);cx.fill()}else if(p.star)starPath(p.w*.75);else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();if(p.t>=p.life||p.y>innerHeight+30)P.splice(i,1)}
  cx.globalAlpha=1;
  if(P.length||R.length)raf=requestAnimationFrame(loop);else{raf=null;cx.clearRect(0,0,innerWidth,innerHeight)}}
let bnT;
function banner(t,sub,ms,big){if(!partyOn)return;BN.className='';void BN.offsetWidth;$('.bw',BN).textContent=t;$('.bs',BN).textContent=sub||'';BN.className='show'+(big?' big':'');clearTimeout(bnT);bnT=setTimeout(()=>BN.className='',ms||1600)}

function party(lv,el,title,sub){

function checkItem(it){
  const r={};
  const sv=it.S.trim().toLowerCase(),vg=VAGUE.filter(v=>new RegExp('\\b'+v+'\\b').test(sv));
  if(!sv)r.S=['off',''];else if(words(sv)<5)r.S=['warn','Add detail. What exactly will you do, and what will you do it with?'];
  else if(vg.length)r.S=['warn',`"${vg[0]}" is fuzzy. ${vg[0]==='try'?'Don\'t try. Do.':'Fuzzy how? Name the actual action.'}`];
  else r.S=['ok','Specific. Nice.'];
  const mv=it.M.trim();
  if(!mv)r.M=['off',''];else if(!NUMRX.test(mv))r.M=['warn','Put a number in it. How many, how often, what score?'];else r.M=['ok','Measurable. You can count it.'];
  const av=it.A.trim();
  if(!av)r.A=['off',''];else if(words(av)<4)r.A=['warn','Say what makes it doable: time you have, tools, people who can help.'];else r.A=['ok','Achievable. You have a way in.'];
  const rv=it.R.trim();
  if(!rv)r.R=['off',''];else if(words(rv)<4)r.R=['warn','Connect it to your long-term goal in a full thought.'];else r.R=['ok','Relevant. It moves the big goal.'];
  if(!it.T)r.T=['off',''];else{const d=parseDate(it.T),today=new Date();today.setHours(0,0,0,0);const diff=Math.round((d-today)/864e5);
    if(diff<1)r.T=['warn','That date has passed or is today. Pick a future deadline.'];
    else if(diff>84)r.T=['warn',`That's ${Math.round(diff/7)} weeks out. Pull it in to 12 weeks or sooner.`];
    else r.T=['ok',`${diff} days from now (${(diff/7).toFixed(1)} weeks). Time-bound.`];}
  r.all=['S','M','A','R','T'].every(k=>r[k][0]==='ok');
  return r;
}
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(s){if(!s)return'';return parseDate(s).toLocaleDateString(undefined,{weekday:'short',month:'long',day:'numeric'})}
function smartSentence(it,html){
  const b=(v,ph)=>v.trim()?(html?esc(v.trim()):v.trim()):(html?`<span class="blank">${ph}</span>`:ph);
  return `By ${it.T?(html?esc(fmt(it.T)):fmt(it.T)):(html?'<span class="blank">[deadline]</span>':'[deadline]')}, I will ${b(it.S,'[what exactly]')}. I'll know I did it when ${b(it.M,'[the number]')}. This is doable because ${b(it.A,'[resources and time]')}. It matters because ${b(it.R,'[link to long-term goal]')}.`;
}

function quadHTML(q){const[a,b,c]=QINFO[q];return `<div class="quad ${c}" data-q="${q}"><h4>${q} · ${a}</h4><div class="qs">${b}</div><div id="qb${q}"></div></div>`}
function feedback(){
  const f=[],T=S.tasks,cnt=q=>T.filter(t=>t.q===q).length;
  T.filter(t=>t.smart).forEach(t=>{
    if(t.q===2)f.push(['good',`★ "${esc(t.text)}" is in SCHEDULE. That's where goal work lives: it matters, but nothing forces it to happen, so it needs a spot on the calendar.`]);
    else if(t.q===1)f.push(['warn',`★ "${esc(t.text)}" is in DO NOW. Goal work rarely feels urgent, which is exactly why it gets skipped. Most people move it to SCHEDULE and give it a time slot.`]);
    else f.push(['warn',`★ "${esc(t.text)}" is your own SMART action item, but it landed in ${QINFO[t.q][0]}. If it serves your long-term goal, is it really not important?`]);
  });
  T.filter(t=>t.cat==='Relaxation'&&t.q===4).forEach(t=>f.push(['warn',`"${esc(t.text)}" is in DROP. Your chapter says to put relaxation in your planner on purpose (Relax and Recharge). Rest is something you schedule, not something you cut. Try SCHEDULE.`]));
  if(cnt(1)>cnt(2))f.push(['warn',`You have ${cnt(1)} DO NOW tasks and only ${cnt(2)} SCHEDULE tasks. That's firefighting mode. Planning ahead in box 2 is what keeps tasks from turning into box 1 emergencies.`]);
  else f.push(['good',`Box 2 (SCHEDULE) has ${cnt(2)} tasks. These are the ones that go into your planner in Level 3.`]);
  if(cnt(3))f.push(['good',`Box 3 has ${cnt(3)}. Ask: who could share it, or how can you shrink it so it doesn't eat your study time?`]);
  if(cnt(4))f.push(['good',`Box 4 has ${cnt(4)}. Pick one you will actually cut or cap this week.`]);
  else f.push(['warn','Nothing in DROP? Be honest: is there a time sink you could cap this week?']);
  return f;
}

      if(n>=3&&H===0)fb.push(['warn','Nothing HIGH? What absolutely has to happen this day?']);
      if(n>=5&&d.items.every(x=>x.pri===d.items[0].pri))fb.push(['warn','Every task has the same label. Prioritizing means some things rank lower.']);
      return `<div class="daycard ${i===activeDay?'active':''} ${dayReady(d)?'ready':''}" data-d="${i}">
      <div class="dayhead"><span class="px">DAY ${i+1}</span><select class="daysel" data-d="${i}" aria-label="Day ${i+1}">${DAYS.map(x=>`<option value="${x}" ${d.day===x?'selected':''}>${FULLDAY[x]}</option>`).join('')}</select><span class="cnt ${dayReady(d)?'ok':''}">${n}/7</span></div>
      <div class="gauge"><div style="width:${n/7*100}%"></div><span class="mk"></span></div>
      <input class="tin" data-d="${i}" maxlength="70" placeholder="A task for ${FULLDAY[d.day]}" value="${esc(vals[i]||'')}">
      <div class="addrow">${Object.entries(PRI).map(([k,p])=>`<button class="pbtn" data-d="${i}" data-p="${k}" style="--pc:${p.color}">${p.icon} ${p.label}</button>`).join('')}</div>
      <ol class="qlist">${d.items.map((it,j)=>`<li><button class="pbadge" data-d="${i}" data-j="${j}" style="background:${PRI[it.pri].color}" title="Click to change priority">${PRI[it.pri].icon} ${PRI[it.pri].label}</button><span>${esc(it.text)}</span><button class="x" data-d="${i}" data-j="${j}" title="Remove">×</button></li>`).join('')}</ol>
      ${n>1?`<button class="btn ghost sortb" data-d="${i}" style="font-size:8px;padding:8px 10px">SORT BY PRIORITY</button>`:''}
      <div class="msg">${fb.map(f=>`<div style="${f[0]==='warn'?'color:var(--amber)':f[0]==='ok'?'color:var(--green)':''}">${f[1]}</div>`).join('')}</div></div>`}).join('');
    const all=S.days.every(dayReady);
    $('#dailyDone').innerHTML=all?`<div class="card center mt"><p><b>Three days loaded.</b> That's your 2.3 Part 2.</p><button class="btn amber pulse" id="n4">${S.done[3]?'NEXT LEVEL ▶':'⚔ LOCK IN & ATTACK!'}</button></div>`
      :`<div class="card hint center mt">Give all three days 5 to 7 tasks to unlock the attack.</div>`;
    if(all)$('#n4').onclick=()=>{completeLevel(3);addXP('daily',150);setTimeout(()=>go('mirror'),900)};
  }
  function sync(celebrateDay){const r=S.days.map(dayReady),all=r.every(Boolean);
    if(celebrateDay!=null){const card=$(`.daycard[data-d="${celebrateDay}"]`,box);
      if(r[celebrateDay]&&!prevReady[celebrateDay])party('medium',card,'DAY '+(celebrateDay+1)+' LOADED!',FULLDAY[S.days[celebrateDay].day].toUpperCase()+' IS PLANNED');
      else party('tiny',card.querySelector('.qlist li:last-child')||card);
      if(all&&!allPrev)setTimeout(()=>party('small',$('#n4')),500);}
    prevReady=r;allPrev=all}
  box.addEventListener('click',e=>{
    const pb=e.target.closest('.pbtn');
    if(pb){const i=+pb.dataset.d,inp=$(`.tin[data-d="${i}"]`,box),v=inp.value.trim();activeDay=i;
      if(!v){sfx.bad();toast('Type a task first');inp.focus();return}
      if(S.days[i].items.length>=7){sfx.bad();toast('Max 7! Something has to wait or move to another day.');return}
      S.days[i].items.push({text:v,pri:pb.dataset.p});inp.value='';save();tone({H:880,M:660,L:520}[pb.dataset.p],.07);
      draw();sync(i);$(`.tin[data-d="${i}"]`,box).focus();return}
    const bd=e.target.closest('.pbadge');
    if(bd){const it=S.days[+bd.dataset.d].items[+bd.dataset.j];it.pri={H:'M',M:'L',L:'H'}[it.pri];save();sfx.click();draw();return}
    const x=e.target.closest('.x');
    if(x){S.days[+x.dataset.d].items.splice(+x.dataset.j,1);save();sfx.click();draw();sync();return}
    const sb=e.target.closest('.sortb');
    if(sb){const o={H:0,M:1,L:2};S.days[+sb.dataset.d].items.sort((a,b)=>o[a.pri]-o[b.pri]);save();sfx.good();draw();return}
  });
  box.addEventListener('focusin',e=>{const t=e.target;if(!t.classList||!t.classList.contains('tin'))return;activeDay=+t.dataset.d;
    $$('.daycard',box).forEach(c=>c.classList.toggle('active',+c.dataset.d===activeDay));$('#poolTarget').textContent='Day '+(activeDay+1)});
  box.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('tin')){e.preventDefault();sfx.bad();toast('Pick a priority: HIGH, MEDIUM, or LOW');
    const row=e.target.nextElementSibling;row.classList.remove('wiggle');void row.offsetWidth;row.classList.add('wiggle')}});
  box.addEventListener('change',e=>{if(e.target.classList.contains('daysel')){S.days[+e.target.dataset.d].day=e.target.value;save();draw()}});
  draw();
}

/* ---------- LEVEL 5: MIRROR MATCH (2.3 Part 3) ---------- */
const REFQ=[
 {k:'q1',q:'How does your schedule reflect your actual priorities (school, work, personal life)?',hint:"Compare where your hours actually go with what you say matters most. Where do they match? Where don't they?"},
 {k:'q2',q:'Where are you most likely to lose time or get distracted? How can you avoid that?',hint:'Name the real thing (an app, a place, a time of day), then a specific fix you will actually use.'},
 {k:'q3',q:'What is one strategy you see yourself using moving forward (to-do lists, time blocking, prioritizing, etc.) and why does this work best for you?',hint:'Pick one of the strategies above, name it in your answer, and explain why it fits how YOU work.'}];
const REFSTRATS=[['To-do lists','to-do'],['Time blocking','block'],['Prioritizing (High / Medium / Low)','priorit'],['Eisenhower Matrix','eisenhower'],['Pomodoro Method','pomodoro'],['Color coding','color'],['Working backward from due dates','backward'],['Alarm reminders','alarm']];
function reflStatus(t){const n=words(t),paras=(t||'').split(/\n\s*\n/).filter(x=>x.trim()).length;
  if(!n)return['',''];if(n<40)return['warn',`${n} of 40 words. Keep going.`];
  if(n>230)return['ok',`✓ Locked in. (${n} words is a lot. The assignment asks for 1 to 2 short paragraphs, so consider trimming.)`];
  if(paras>2)return['ok',`✓ Locked in. (That's ${paras} paragraphs. The assignment asks for 1 to 2.)`];
  return['ok',`✓ Locked in. ${n} words.`]}
function rMirror(){
  const c=counts(),hrs=Object.entries(c).sort((a,b)=>b[1]-a[1]),cr=S.credits;
  const highs=S.days.flatMap(d=>d.items.filter(i=>i.pri==='H').map(i=>i.text));
  const sinks=S.tasks.filter(t=>t.q===3||t.q===4).map(t=>t.text);
  const data={
    q1:`<b>Where your week goes:</b> ${hrs.map(([k,v])=>`${CATS[k].label} ${v} h`).join(' · ')||'nothing painted yet'}${cr?`<br><b>Your study target:</b> ${2*cr} to ${3*cr} h a week`:''}<br><b>Your HIGH priority tasks:</b> ${highs.map(esc).join('; ')||'none'}`,
    q2:`<b>Tasks you put in box 3 or 4 of your matrix:</b> ${sinks.map(esc).join('; ')||'none'}<br><b>Unplanned hours in your week:</b> ${168-Object.keys(S.grid).length}. Where does that time usually go?`,
    q3:`<b>Tools you used in this game:</b> SMART goals, the Eisenhower Matrix, time blocking (Week Builder), a prioritized to-do list${S.back.length?', working backward from due dates':''}.`};
  main.innerHTML=`<section class="panel">
  <h2 class="px">LEVEL 5 · MIRROR MATCH</h2>
  <p class="lead"><b>2.3 Part 3: Analyze your plan.</b> The Procrastinator can't survive an honest look in the mirror. Answer each question in <b>1 to 2 short paragraphs</b>. The blue boxes show your own numbers from this game, so use them as evidence.</p>
  ${REFQ.map((r,i)=>`<div class="card mirror"><h3 class="px">QUESTION ${i+1}</h3><p class="q" style="font-size:17px">${r.q}</p>
    <div class="data">🪞 ${data[r.k]}</div>
    ${r.k==='q3'?`<div class="stratchips" id="schips">${REFSTRATS.map(([n])=>`<button class="schip ${S.refl.strat===n?'on':''}" data-s="${esc(n)}">${n}</button>`).join('')}</div>`:''}
    <div class="hint">${r.hint}</div>
    <textarea id="r_${r.k}" data-k="${r.k}" rows="6" placeholder="1 to 2 short paragraphs">${esc(S.refl[r.k])}</textarea>
    <div class="msg" id="rm_${r.k}"></div><div class="msg warn" id="rx_${r.k}"></div></div>`).join('')}
  <div class="card center" id="mirrorDone"></div></section>`;
  const prev={};let readyPrev=null;
  $('#schips').onclick=e=>{const b=e.target.closest('.schip');if(!b)return;S.refl.strat=b.dataset.s;save();$$('.schip').forEach(x=>x.classList.toggle('on',x===b));party('small',b);upd()};
  $$('.mirror textarea').forEach(t=>t.oninput=()=>{S.refl[t.dataset.k]=t.value;save();upd()});
  function upd(){
    const ok=REFQ.map(r=>{const[st,msg]=reflStatus(S.refl[r.k]),el=$('#rm_'+r.k);el.className='msg '+st;el.textContent=msg;
      const good=st==='ok';if(good&&prev[r.k]===false)party('tiny',el);prev[r.k]=good;return good});
    const s=REFSTRATS.find(x=>x[0]===S.refl.strat);
    $('#rx_q3').textContent=s&&words(S.refl.q3)>=40&&!S.refl.q3.toLowerCase().includes(s[1])?`Tip: name your strategy (${s[0]}) in the answer.`:'';
    const ready=ok.every(Boolean)&&!!S.refl.strat;
    $('#mirrorDone').innerHTML=`<ul class="req" style="display:inline-block;text-align:left">${REFQ.map((r,i)=>`<li class="${ok[i]?'ok':'no'}">${ok[i]?'✓':'○'} Question ${i+1}: at least 40 words</li>`).join('')}<li class="${S.refl.strat?'ok':'no'}">${S.refl.strat?'✓':'○'} Pick your strategy for question 3</li></ul>
      <div class="mt"><button class="btn amber ${ready&&!S.done[4]?'pulse':''}" id="n5" ${ready?'':'disabled'}>${S.done[4]?'NEXT LEVEL ▶':'⚔ SHATTER THE MIRROR!'}</button>
      ${S.done[4]?' <button class="btn" id="toTpl">📄 OPEN 2.3 TEMPLATE</button>':''}</div>`;
    if(ready&&readyPrev===false)setTimeout(()=>party('small',$('#n5')),50);readyPrev=ready;
    $('#n5').onclick=()=>{if(!S.done[4]){completeLevel(4);addXP('mirror',150);setTimeout(()=>go('l4'),1100)}else go('l4')};
    const tt=$('#toTpl');if(tt)tt.onclick=()=>go('tpl');
  }
  upd();
}

const pad2=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function mondayOf(s){const d=s?parseDate(s):new Date();d.setHours(0,0,0,0);const dow=(d.getDay()+6)%7;
  if(s)d.setDate(d.getDate()-dow);else d.setDate(d.getDate()+(dow===0?0:7-dow));return isoD(d)}
const tplHr=h=>((h%12)||12)+':00';
function schedCell(d,h){const k=d+'-'+h,c=S.grid[k];return c?(S.glab[k]||CATS[c].label):''}
function sortedItems(day){const o={H:0,M:1,L:2};return day.items.map((it,i)=>Object.assign({i},it)).sort((a,b)=>o[a.pri]-o[b.pri]||a.i-b.i)}
const todoLine=(it,j)=>`${j+1}. ${it.text} (${PRI[it.pri].full})`;
function copyText(txt,btn){const done=ok=>{if(ok){const o=btn.textContent;btn.textContent='✓ COPIED';sfx.good();party('tiny',btn);setTimeout(()=>btn.textContent=o,1500)}else toast('Copy blocked. Select the text and press Ctrl+C.')};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();done(ok)};
  try{navigator.clipboard.writeText(txt).then(()=>done(true),fb)}catch(e){fb()}}
let JSZipP=null;
function loadJSZip(){if(window.JSZip)return Promise.resolve(window.JSZip);
  if(!JSZipP)JSZipP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    sc.onload=()=>res(window.JSZip);sc.onerror=()=>{JSZipP=null;rej(new Error('jszip'))};document.head.appendChild(sc)});return JSZipP}
function b64bytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
const XMLNS_XML='http://www.w3.org/XML/1998/namespace',XDECL='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n';
const ser=doc=>{const o=new XMLSerializer().serializeToString(doc);return o.startsWith('<?xml')?o:XDECL+o};
const kids=(n,name)=>[...n.childNodes].filter(c=>c.localName===name);

async function buildDocx(){
  const JSZip=await loadJSZip(),zip=await JSZip.loadAsync(b64bytes(TPL_DOCX));
  const doc=new DOMParser().parseFromString(await zip.file('word/document.xml').async('string'),'application/xml');
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',el=n=>doc.createElementNS(W,'w:'+n);
  const run=(text,sz,bold)=>{const r=el('r');if(sz||bold){const rp=el('rPr');if(bold)rp.appendChild(el('b'));if(sz){['sz','szCs'].forEach(t=>{const e=el(t);e.setAttributeNS(W,'w:val',sz);rp.appendChild(e)})}r.appendChild(rp)}
    const t=el('t');t.setAttributeNS(XMLNS_XML,'xml:space','preserve');t.textContent=text;r.appendChild(t);return r};
  const clearRuns=p=>[...p.childNodes].forEach(n=>{if(n.localName!=='pPr')p.removeChild(n)});
  const ptext=p=>[...p.getElementsByTagNameNS(W,'t')].map(t=>t.textContent).join('');
  /* weekly schedule table: rows 1-18 = 6:00 AM to 11:00 PM, columns 1-7 = Monday to Sunday */
  const tbl=doc.getElementsByTagNameNS(W,'tbl')[0],rows=kids(tbl,'tr');
  for(let i=1;i<rows.length&&i<=18;i++){const cells=kids(rows[i],'tc');for(let d=0;d<7;d++){const txt=schedCell(d,5+i);if(!txt||!cells[d+1])continue;kids(cells[d+1],'p')[0].appendChild(run(txt,'18'))}}
  const body=doc.getElementsByTagNameNS(W,'body')[0],ps=kids(body,'p');
  /* to-do lists */
  ps.filter(p=>/^To do items Day/i.test(ptext(p))).forEach((hp,di)=>{const day=S.days[di];if(!day)return;
    hp.appendChild(run(' ('+FULLDAY[day.day]+')'));
    const nums=[];let n=hp.nextSibling;while(n&&nums.length<3){if(n.localName==='p'&&/^\d\.$/.test(ptext(n).trim()))nums.push(n);else if(n.localName==='p'&&ptext(n).trim())break;n=n.nextSibling}
    if(!nums.length)return;let last=nums[nums.length-1];
    sortedItems(day).forEach((it,j)=>{let p=nums[j];if(!p){p=last.cloneNode(true);last.parentNode.insertBefore(p,last.nextSibling)}
      clearRuns(p);p.appendChild(run(todoLine(it,j)));last=p});});
  /* reflection answers: inserted under each question */
  const qp=ps.filter(p=>{const pp=kids(p,'pPr')[0];return pp&&pp.getElementsByTagNameNS(W,'numPr').length&&/\?/.test(ptext(p))});
  const blankLP=qp.length&&qp[0].nextSibling&&qp[0].nextSibling.localName==='p'?qp[0].nextSibling.cloneNode(true):null;
  ['q1','q2','q3'].forEach((k,i)=>{const q=qp[i];if(!q||!blankLP)return;let after=q;
    (S.refl[k]||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(par=>{const p=blankLP.cloneNode(true);clearRuns(p);p.appendChild(run(par));after.parentNode.insertBefore(p,after.nextSibling);after=p})});
  zip.file('word/document.xml',ser(doc));
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

    while(c.firstChild)c.removeChild(c.firstChild);return c}
  const setStr=(ref,text,style)=>{const c=cellEl(ref);c.setAttribute('t','inlineStr');if(style!=null)c.setAttribute('s',style);
    const is=sd.createElementNS(NS,'is'),t=sd.createElementNS(NS,'t');t.setAttributeNS(XMLNS_XML,'xml:space','preserve');t.textContent=text;is.appendChild(t);c.appendChild(is)};
  const setNum=(ref,v)=>{const c=cellEl(ref);c.removeAttribute('t');const e=sd.createElementNS(NS,'v');e.textContent=String(v);c.appendChild(e)};
  const setF=(ref,f,cached)=>{const c=cellEl(ref);c.setAttribute('t','str');const fe=sd.createElementNS(NS,'f');fe.textContent=f;c.appendChild(fe);const v=sd.createElementNS(NS,'v');v.textContent=cached;c.appendChild(v)};
  /* merges (only where none exist yet) */
  const mc=sd.getElementsByTagNameNS(NS,'mergeCells')[0];
  const rng=r=>{const[a,b]=r.split(':'),pa=a.match(/^([A-Z]+)(\d+)$/),pb=b.match(/^([A-Z]+)(\d+)$/);return{c1:colNum(pa[1]),r1:+pa[2],c2:colNum(pb[1]),r2:+pb[2]}};
  const existing=kids(mc,'mergeCell').map(m=>rng(m.getAttribute('ref')));
  const addMerge=ref=>{const n=rng(ref);if(existing.some(e=>!(n.c2<e.c1||n.c1>e.c2||n.r2<e.r1||n.r1>e.r2)))return;const m=sd.createElementNS(NS,'mergeCell');m.setAttribute('ref',ref);mc.appendChild(m);existing.push(n)};
  /* week of + day/month headers */
  const wk=parseDate(S.weekOf||mondayOf()),serial=Math.round((Date.UTC(wk.getFullYear(),wk.getMonth(),wk.getDate())-Date.UTC(1899,11,30))/864e5);
  setNum('V4',serial);
  const DC=['D','J','O','T','Y','AD','AI'],DAYCELL=['E','K','P','U','Z','AE','AJ'];
  ['C','I','N','S','X','AC','AH'].forEach((col,i)=>{const d=new Date(wk);d.setDate(wk.getDate()+i);setF(col+'6',`TEXT(StartDate+${i},"dd")`,pad2(d.getDate()))});
  DAYCELL.forEach((col,i)=>{const d=new Date(wk);d.setDate(wk.getDate()+i);
    setF(col+'6',`TEXT(StartDate+${i},"dddd")`,d.toLocaleDateString('en-US',{weekday:'long'}));
    setF(col+'7',`TEXT(StartDate+${i},"mmmm")`,d.toLocaleDateString('en-US',{month:'long'}))});
  /* schedule rows 8-25 = 6:00 AM to 11:00 PM */
  const ENDC=['H','M','R','W','AB','AG','AM'];
  for(let i=0;i<18;i++){const r=8+i;DC.forEach((col,d)=>{addMerge(`${col}${r}:${ENDC[d]}${r}`);const txt=schedCell(d,6+i);if(txt)setStr(col+r,txt)})}
  /* to-do items: Day 1 = C, Day 2 = Q, Day 3 = AC; rows 28-34 */
  [['C','M'],['Q','Z'],['AC','AM']].forEach(([c1,c2],di)=>{const day=S.days[di];if(!day)return;
    const hc=['C27','P27','AC27'][di];setStr(hc,`${['To do Items Day 1','To do items Day 2','To do items Day 3'][di]} (${FULLDAY[day.day]})`);
    sortedItems(day).slice(0,7).forEach((it,j)=>{const r=28+j;addMerge(`${c1}${r}:${c2}${r}`);setStr(c1+r,todoLine(it,j))})});
  /* reflection answers with a wrapping style */
  const xfs=st.getElementsByTagNameNS(NS,'cellXfs')[0],xl=kids(xfs,'xf'),base=xl[102]||xl[0],nx=base.cloneNode(true);
  kids(nx,'alignment').forEach(a=>nx.removeChild(a));const al=st.createElementNS(NS,'alignment');al.setAttribute('wrapText','1');al.setAttribute('vertical','top');al.setAttribute('horizontal','left');
  const ext=kids(nx,'extLst')[0];nx.insertBefore(al,kids(nx,'protection')[0]||ext||null);nx.setAttribute('applyAlignment','1');xfs.appendChild(nx);
  const wrapIdx=xl.length;xfs.setAttribute('count',String(wrapIdx+1));
  [['q1',40],['q2',43],['q3',46]].forEach(([k,r])=>{const t=(S.refl[k]||'').trim();if(!t)return;addMerge(`D${r}:AM${r}`);setStr('D'+r,t,wrapIdx);
    const lines=t.split('\n').reduce((a,p)=>a+Math.max(1,Math.ceil(p.length/105)),0);const row=rowsByNum[r];row.setAttribute('ht',String(Math.min(409,lines*16+10)));row.setAttribute('customHeight','1')});
  mc.setAttribute('count',String(kids(mc,'mergeCell').length));
  const cp=wb.getElementsByTagNameNS(NS,'calcPr')[0];if(cp)cp.setAttribute('fullCalcOnLoad','1');
  zip.file('xl/worksheets/sheet1.xml',ser(sd));zip.file('xl/styles.xml',ser(st));zip.file('xl/workbook.xml',ser(wb));
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function offerFile(kind,btn){
  const msg=$('#dlMsg'),name=(String(S.name).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'Student')+'_Plan_Your_Week_for_Success.'+kind;
  msg.className='msg';msg.textContent='Building your file...';btn.disabled=true;
  let blob;try{blob=kind==='docx'?await buildDocx():await buildXlsx()}catch(e){btn.disabled=false;msg.className='msg warn';msg.textContent="Couldn't build the file here. Use the Copy buttons below instead.";return}
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads');
      if(!dl){msg.className='msg warn';msg.textContent="Downloads aren't available in this view. Use the Copy buttons below.";btn.disabled=false;return}
      await dl.save({filename:name,data:blob});
    }else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
    msg.className='msg ok';msg.textContent='✓ '+name+' saved. Open it, check it, and fix anything before you submit.';party('medium',btn,'FILE SAVED!','OPEN IT AND CHECK IT');
  }catch(e){const code=e&&e.code;msg.className='msg warn';
    msg.textContent=code==='declined'?'Download canceled.':code==='rate_limited'?'One download at a time. Try again in a moment.':"Couldn't save the file here. Use the Copy buttons below."}
  btn.disabled=false;
}
function rTpl(){
  if(!S.weekOf){S.weekOf=mondayOf();save()}
  const wk=parseDate(S.weekOf),dates=DAYS.map((x,i)=>{const d=new Date(wk);d.setDate(wk.getDate()+i);return d});
  let tb=`<table class="tpl"><thead><tr><th></th>${dates.map((d,i)=>`<th>${FULLDAY[DAYS[i]]}<br><span style="font-weight:400">${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></th>`).join('')}</tr></thead><tbody>`;
  for(let h=6;h<=23;h++){tb+=`<tr><td class="t">${tplHr(h)}</td>`;for(let d=0;d<7;d++){const c=S.grid[d+'-'+h];tb+=`<td style="${c?`background:${CATS[c].color}33`:''}">${esc(schedCell(d,h))}</td>`}tb+='</tr>'}
  tb+='</tbody></table>';
  const schedTxt=['\t'+DAYS.map(x=>FULLDAY[x]).join('\t')].concat(Array.from({length:18},(_,i)=>[tplHr(6+i)].concat(DAYS.map((x,d)=>schedCell(d,6+i))).join('\t'))).join('\n');
  const todoTxt=S.days.map((d,i)=>`To do items Day ${i+1} (${FULLDAY[d.day]})\n`+sortedItems(d).map(todoLine).join('\n')).join('\n\n');
  const reflTxt='Reflection Questions\n\n'+REFQ.map(r=>r.q+'\n'+(S.refl[r.k]||'').trim()).join('\n\n');
  main.innerHTML=`<section class="panel">
  <h2 class="px">2.3 · PLAN YOUR WEEK FOR SUCCESS</h2>
  <p class="lead">Your schedule, three-day to-do list, and reflection, laid out like ECPI's template. Download the template already filled in, or copy one section at a time.</p>
  <div class="card"><div class="row" style="align-items:flex-end">
    <div style="max-width:260px"><label class="q" for="weekOf">Week of (Monday)</label><input type="date" id="weekOf" value="${S.weekOf}"></div>
    <div><div class="dlrow"><button class="btn amber" id="dlDocx">⬇ WORD TEMPLATE (.DOCX)</button><button class="btn" id="dlXlsx">⬇ EXCEL TEMPLATE (.XLSX)</button></div><div class="msg" id="dlMsg"></div></div>
  </div>
  <p class="hint">ECPI's schedule runs 6:00 AM to 11:00 PM, so blocks outside those hours (like most of your sleep) won't show on it. Always open your file and check it before you submit.</p></div>
  ${S.done[3]?'':'<p class="hint">Finish Level 4 to fill in your to-do lists.</p>'}
  </section>
  <div class="slide"><button class="btn cp" id="cpS">COPY</button><h3>WEEKLY SCHEDULE</h3><div class="tplscroll">${tb}</div></div>
  <div class="slide amb"><button class="btn cp" id="cpT">COPY</button><h3>TO DO ITEMS</h3><div class="todo3">${S.days.map((d,i)=>`<div><p class="lbl" style="margin:0">To do items Day ${i+1} (${FULLDAY[d.day]})</p><ol>${sortedItems(d).map((it,j)=>`<li style="margin:4px 0">${j+1}. ${esc(it.text)} <b style="color:${it.pri==='H'?'#c0262c':it.pri==='M'?'#9a6400':'#1f6f9a'}">(${PRI[it.pri].full})</b></li>`).join('')||'<li>(none yet)</li>'}</ol></div>`).join('')}</div></div>
  <div class="slide"><button class="btn cp" id="cpR">COPY</button><h3>REFLECTION QUESTIONS</h3>${REFQ.map(r=>`<p class="lbl" style="margin:12px 0 4px">• ${r.q}</p>${(S.refl[r.k]||'(not answered yet)').split(/\n+/).map(p=>`<p style="margin:4px 0">${esc(p)}</p>`).join('')}`).join('')}</div>`;
  $('#weekOf').onchange=e=>{if(!e.target.value)return;S.weekOf=mondayOf(e.target.value);save();if(S.weekOf!==e.target.value)toast('Snapped to Monday '+fmt(S.weekOf));rTpl()};
  $('#dlDocx').onclick=()=>offerFile('docx',$('#dlDocx'));$('#dlXlsx').onclick=()=>offerFile('xlsx',$('#dlXlsx'));
  $('#cpS').onclick=()=>copyText(schedTxt,$('#cpS'));$('#cpT').onclick=()=>copyText(todoTxt,$('#cpT'));$('#cpR').onclick=()=>copyText(reflTxt,$('#cpR'));
}

/* ---------- boot ---------- */
if(!unlocked(S.view))S.view='start';
go(S.view);
})();
</script>
